# コックピット デモ用の nginx 設定（nginx-unprivileged、8080 番）
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Ingress やポート転送の内側でも /story → /story/ のリダイレクトが壊れないように
    absolute_redirect off;
    server_tokens     off;

    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kubernetes の readiness / liveness 用
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML とシナリオは更新がすぐ反映されるように毎回確認させる
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 音声・動画・フォント・画像はキャッシュしてよい（mp4 / mp3 は Range 要求にも対応）
    location ~* \.(mp3|mp4|woff2?|ttf|png|jpe?g|svg)$ {
        expires 7d;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
